name: Host-Ship Auto Renew

on:
  schedule:
    # 结合你之前的需求，如果到期时间规律固定，可以使用 cron 调整频率。
    # 这里默认每天北京时间晚上 9:30 自动执行检查。
    - cron: '30 13 * * *'
  workflow_dispatch:

jobs:
  Renew-HostShip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统底层 GUI 依赖 (用于虚拟屏幕和过盾点击)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev scrot dbus-x11

      - name: 🛠️ 安装 Python 运行库
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyautogui

      # ====== (可选) 如果你在这个脚本也需要开启代理，请在这里添加设置代理的 steps ======
      
      - name: 🚀 运行续期脚本
        env:
          HOSTSHIP_EMAIL: ${{ secrets.HOSTSHIP_EMAIL }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # 使用 xvfb-run 启动，模拟带显示器的环境
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 hostship_run.py

      - name: 收集过程截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-screenshots
          path: '*.png'
          if-no-files-found: ignore
